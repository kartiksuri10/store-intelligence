version: '3.8'

services:
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex123
      POSTGRES_DB: storedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - store-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d storedb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://apex:apex123@db:5432/storedb
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - store-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  store-net:
